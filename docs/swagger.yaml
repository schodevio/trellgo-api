basePath: /api/v1
definitions:
  apierrors.APIError:
    properties:
      code:
        type: string
      details:
        $ref: '#/definitions/apierrors.ErrorDetails'
      message:
        type: string
    type: object
  apierrors.ErrorDetails:
    additionalProperties:
      items:
        type: string
      type: array
    type: object
  apierrors.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/apierrors.APIError'
    type: object
  auth.SignInRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.SignInResponse:
    properties:
      access_token:
        type: string
    type: object
  auth.SignUpRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.SignUpResponse:
    properties:
      email:
        type: string
    type: object
  boards.BoardResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  boards.CreateBoardRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  boards.ListBoardsResponse:
    properties:
      boards:
        items:
          $ref: '#/definitions/boards.BoardResponse'
        type: array
    type: object
  boards.SingleBoardResponse:
    properties:
      board:
        $ref: '#/definitions/boards.BoardResponse'
    type: object
  boards.UpdateBoardRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  cards.CardResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      list_id:
        type: string
      position:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  cards.CreateCardRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      position:
        minimum: 0
        type: integer
      status:
        enum:
        - todo
        - in_progress
        - done
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - position
    - status
    - title
    type: object
  cards.ListCardsResponse:
    properties:
      cards:
        items:
          $ref: '#/definitions/cards.CardResponse'
        type: array
    type: object
  cards.SingleCardResponse:
    properties:
      card:
        $ref: '#/definitions/cards.CardResponse'
    type: object
  cards.UpdateCardRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      position:
        minimum: 0
        type: integer
      status:
        enum:
        - todo
        - in_progress
        - done
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - position
    - status
    - title
    type: object
  lists.CreateListRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
      position:
        minimum: 0
        type: integer
    required:
    - name
    - position
    type: object
  lists.ListListsResponse:
    properties:
      lists:
        items:
          $ref: '#/definitions/lists.ListResponse'
        type: array
    type: object
  lists.ListResponse:
    properties:
      board_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      position:
        type: integer
      updated_at:
        type: string
    type: object
  lists.SingleListResponse:
    properties:
      list:
        $ref: '#/definitions/lists.ListResponse'
    type: object
  lists.UpdateListRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
      position:
        minimum: 0
        type: integer
    required:
    - name
    - position
    type: object
host: localhost:3000
info:
