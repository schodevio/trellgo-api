          description: OK
          schema:
            $ref: '#/definitions/auth.SignInResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierrors.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/signin:
    post:
      consumes:
