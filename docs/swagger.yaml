        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierrors.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apierrors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apierrors.ErrorResponse'
      summary: Sign up
      tags:
      - auth
